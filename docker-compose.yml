services:
  app:
    build: .
    container_name: punchcard
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - punchcard_data:/app/data
    environment:
      - STATS_FILE=/app/data/.stats.json
      - CONTRIB_DIR=/app/data/contrib

volumes:
  punchcard_data:

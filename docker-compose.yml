services:
  app:
    build: .
    container_name: punchcard
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    volumes:
      - punchcard_data:/app/data
    environment:
      - STATS_FILE=/app/data/.stats.json
      - CONTRIB_DIR=/app/data/contrib

  wg:
    build: ./wg
    container_name: punchcard-wg
    restart: unless-stopped
    network_mode: "service:app"
    depends_on:
      - app
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    env_file: .env
    volumes:
      - /lib/modules:/lib/modules:ro

volumes:
  punchcard_data:

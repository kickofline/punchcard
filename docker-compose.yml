services:
  app:
    build: .
    container_name: punchcard
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - /lib/modules:/lib/modules:ro
      - punchcard_data:/app/data
    env_file: .env
    ports:
      - "3001:3000"
    environment:
      - STATS_FILE=/app/data/.stats.json
      - CONTRIB_DIR=/app/data/contrib

volumes:
  punchcard_data:
